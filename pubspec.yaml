name: flux_android
description: "Flux Calendar - Full-featured calendar and task management app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP & Networking
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  
  # UI
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  intl: ^0.19.0
  
  # Date picker
  table_calendar: ^3.1.2
  
  # URL launcher
  url_launcher: ^6.3.1
  
  # File picker
  file_picker: ^8.1.3
  
  # Image
  cached_network_image: ^3.4.1
  
  # Avatar
  flutter_svg: ^2.0.10+1
  
  # Animations
  flutter_animate: ^4.5.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
